---
apiVersion: v1
kind: Service
metadata:
  name: mdb-autodisc-master-0-lb
  namespace: default
  annotations:
    metallb.io/loadBalancerIPs: $CIDR_PREFIX.0.207
spec:
  ports:
  - name: mariadb
    port: 3306
    protocol: TCP
    targetPort: 3306
  - name: agent
    port: 5555
    protocol: TCP
    targetPort: 5555
  - name: agent-probe
    port: 5566
    protocol: TCP
    targetPort: 5566
  selector:
    app.kubernetes.io/instance: mdb-autodisc-master
    app.kubernetes.io/name: mariadb
    statefulset.kubernetes.io/pod-name: mdb-autodisc-master-0
  publishNotReadyAddresses: true
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: mdb-autodisc-master-1-lb
  namespace: default
  annotations:
    metallb.io/loadBalancerIPs: $CIDR_PREFIX.0.208
spec:
  ports:
  - name: mariadb
    port: 3306
    protocol: TCP
    targetPort: 3306
  - name: agent
    port: 5555
    protocol: TCP
    targetPort: 5555
  - name: agent-probe
    port: 5566
    protocol: TCP
    targetPort: 5566
  selector:
    app.kubernetes.io/instance: mdb-autodisc-master
    app.kubernetes.io/name: mariadb
    statefulset.kubernetes.io/pod-name: mdb-autodisc-master-1
  publishNotReadyAddresses: true
  type: LoadBalancer
